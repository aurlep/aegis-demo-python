# Generated by Aegis. Review before committing.
# Actions are pinned to commit SHAs (Dependabot keeps them current); each
# job reports rather than fails the build -- tighten once findings are triaged.
name: security
'on':
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x
      - name: Install Bandit
        run: pip install 'bandit[sarif]'
      - name: Report (Bandit)
        run: bandit -r . -f sarif -o results.sarif || true
      - name: Send findings to Aegis
        if: always()
        run: 'curl -sf -X POST "$AEGIS_URL/api/v1/repositories/fa057608-12c5-4599-9b95-123b701f687f/findings:ingest?scanner=bandit"
          -H "Authorization: Aegis-CI $AEGIS_INGEST_TOKEN" -H "X-Aegis-Organization:
          7b5b6e10-f2c2-4e6e-83fb-41c999b01d47" -H "Content-Type: application/json"
          --data-binary @results.sarif || echo ''Aegis ingest skipped (unreachable)'''
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bandit-report
          path: results.sarif
  trivy:
    name: Dependencies, secrets & IaC (Trivy)
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.58.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Report (Trivy)
        run: trivy fs --scanners vuln,secret,misconfig --format sarif --output results.sarif
          --exit-code 0 .
      - name: Send findings to Aegis
        if: always()
        run: 'curl -sf -X POST "$AEGIS_URL/api/v1/repositories/fa057608-12c5-4599-9b95-123b701f687f/findings:ingest?scanner=trivy"
          -H "Authorization: Aegis-CI $AEGIS_INGEST_TOKEN" -H "X-Aegis-Organization:
          7b5b6e10-f2c2-4e6e-83fb-41c999b01d47" -H "Content-Type: application/json"
          --data-binary @results.sarif || echo ''Aegis ingest skipped (unreachable)'''
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-report
          path: results.sarif
  pip-audit:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Report (pip-audit)
        run: pip-audit -f json -o pip-audit.json || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pip-audit-report
          path: pip-audit.json
  checkov:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7  # v12
        with:
          output_format: sarif
          output_file_path: results.sarif
          soft_fail: true
      - name: Send findings to Aegis
        if: always()
        run: 'curl -sf -X POST "$AEGIS_URL/api/v1/repositories/fa057608-12c5-4599-9b95-123b701f687f/findings:ingest?scanner=checkov"
          -H "Authorization: Aegis-CI $AEGIS_INGEST_TOKEN" -H "X-Aegis-Organization:
          7b5b6e10-f2c2-4e6e-83fb-41c999b01d47" -H "Content-Type: application/json"
          --data-binary @results.sarif || echo ''Aegis ingest skipped (unreachable)'''
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: checkov-report
          path: results.sarif
  hadolint:
    name: Container (Hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: results.sarif
          no-fail: true
      - name: Send findings to Aegis
        if: always()
        run: 'curl -sf -X POST "$AEGIS_URL/api/v1/repositories/fa057608-12c5-4599-9b95-123b701f687f/findings:ingest?scanner=hadolint"
          -H "Authorization: Aegis-CI $AEGIS_INGEST_TOKEN" -H "X-Aegis-Organization:
          7b5b6e10-f2c2-4e6e-83fb-41c999b01d47" -H "Content-Type: application/json"
          --data-binary @results.sarif || echo ''Aegis ingest skipped (unreachable)'''
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hadolint-report
          path: results.sarif
